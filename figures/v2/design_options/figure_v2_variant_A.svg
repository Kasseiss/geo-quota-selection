<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="180mm" height="274.0mm" viewBox="0 0 180 274.0" version="1.1">
<title>figure_v2_variant_A</title>
<desc>Extension-study methods only. No performance values. Editable Arial text. The new panel has no feedback connection to development, selection or calibration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker></defs>
<g id="page"><rect x="0.0" y="0.0" width="180.0" height="274.0" fill="#FFFFFF"/></g>
<g id="labels" inkscape:groupmode="layer" inkscape:label="Title and panel labels">
<g id="title"><text x="8.0" y="8.0" font-family="Arial" font-size="4.0" font-weight="bold" fill="#000000" text-anchor="start">Source selection and permanently held-out evaluation</text></g>
<g id="panel-label-a"><text x="8.0" y="15.5" font-family="Arial" font-size="3.7" font-weight="bold" fill="#000000" text-anchor="start">a</text></g>
<g id="panel-label-b"><text x="8.0" y="56.5" font-family="Arial" font-size="3.7" font-weight="bold" fill="#000000" text-anchor="start">b</text></g>
<g id="panel-label-c"><text x="8.0" y="133.5" font-family="Arial" font-size="3.7" font-weight="bold" fill="#000000" text-anchor="start">c</text></g>
<g id="panel-label-d"><text x="8.0" y="200.5" font-family="Arial" font-size="3.7" font-weight="bold" fill="#000000" text-anchor="start">d</text></g>
</g>
<g id="panel-a" inkscape:groupmode="layer" inkscape:label="Development regions and fixed allocations">
<g id="development"><rect x="8.0" y="18.0" width="164.0" height="23.0" rx="0.0" fill="#FFFFFF" stroke="#000000" stroke-width="0.3"/></g>
<g id="development-text-1"><text x="13.0" y="25.0" font-family="Arial" font-size="3.3" font-weight="bold" fill="#000000" text-anchor="start">Old development: 24 regions × 5 images = 120</text></g>
<g id="development-text-2"><text x="13.0" y="30.5" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">3 fixed source allocations: 12 train / 4 validation / 8 unused</text></g>
<g id="development-text-3"><text x="13.0" y="36.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">All earlier test regions are now development data</text></g>
</g>
<g id="panel-b" inkscape:groupmode="layer" inkscape:label="Candidate pools and eight selectors">
<g id="selection"><rect x="8.0" y="59.0" width="164.0" height="59.0" rx="0.0" fill="#FFFFFF" stroke="#000000" stroke-width="0.3"/></g>
<g id="selection-title"><text x="13.0" y="66.0" font-family="Arial" font-size="3.7" font-weight="bold" fill="#000000" text-anchor="start">36 candidates per source allocation; two pool profiles</text></g>
<g id="selection-details-1"><text x="13.0" y="72.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Balanced: 12 × 3 images; imbalanced: 6 × 5 + 6 × 1 images</text></g>
<g id="selection-details-2"><text x="13.0" y="77.5" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">DINOv2 RGB descriptors + source IDs + budget + seed</text></g>
<g id="selection-details-3"><text x="13.0" y="83.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">8 selectors; candidate masks and target features excluded</text></g>
<g id="eight-policies-1"><text x="13.0" y="91.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Random · k-center · quota random · quota k-center</text></g>
<g id="eight-policies-2"><text x="13.0" y="96.5" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Permuted quota k-center · k-means++ · facility location</text></g>
<g id="eight-policies-3"><text x="13.0" y="102.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Feature-diversity round-robin (adaptation)</text></g>
<g id="weighted-fl-supplement-1"><text x="13.0" y="107.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Plus two skewed-only weighted FL controls: real / permuted source groups</text></g>
<g id="weighted-fl-supplement-2"><text x="13.0" y="112.5" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Same FL objective; row weights 1/(R × n_group); columns unweighted</text></g>
</g>
<g id="panel-c" inkscape:groupmode="layer" inkscape:label="Two different model recipes">
<g id="recipe-container"><rect x="8.0" y="136.0" width="164.0" height="49.0" rx="0.0" fill="#FFFFFF" stroke="#000000" stroke-width="0.3"/></g>
<g id="recipe-title"><text x="13.0" y="143.0" font-family="Arial" font-size="3.7" font-weight="bold" fill="#000000" text-anchor="start">Fit the selected images using two different model recipes</text></g>
<g id="full-recipe-1"><text x="13.0" y="150.0" font-family="Arial" font-size="3.3" font-weight="bold" fill="#000000" text-anchor="start">ResNet18 U-Net-style</text></g>
<g id="full-recipe-2"><text x="13.0" y="155.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">90 fits (72 base + 18 weighted)</text></g>
<g id="full-recipe-3"><text x="13.0" y="160.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">B=12 · imbalanced pool</text></g>
<g id="full-recipe-4"><text x="13.0" y="165.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">All weights trainable; BN stats fixed</text></g>
<g id="full-recipe-5"><text x="13.0" y="170.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">224 crops / 448 inference</text></g>
<g id="frozen-recipe-1"><text x="99.0" y="150.0" font-family="Arial" font-size="3.3" font-weight="bold" fill="#000000" text-anchor="start">Frozen DINOv2 + MLP</text></g>
<g id="frozen-recipe-2"><text x="99.0" y="155.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">486 fits (432 base + 54 weighted)</text></g>
<g id="frozen-recipe-3"><text x="99.0" y="160.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">B=6/12/24 · both pools</text></g>
<g id="frozen-recipe-4"><text x="99.0" y="165.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Head trained; 600 steps; LR 0.001</text></g>
<g id="frozen-recipe-5"><text x="99.0" y="170.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">448 inference</text></g>
<g id="calibration-resource"><text x="13.0" y="177.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Old validation calibrates the full recipe; development labels are outside B.</text></g>
<g id="repetition-resource"><text x="13.0" y="182.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">576 total fits; 3 source allocations × 3 paired fit seeds (0/1/2)</text></g>
</g>
<g id="panel-d" inkscape:groupmode="layer" inkscape:label="Permanent panel and regional analysis">
<g id="evaluation"><rect x="8.0" y="203.0" width="164.0" height="50.0" rx="0.0" fill="#FFFFFF" stroke="#000000" stroke-width="0.3"/></g>
<g id="evaluation-title"><text x="13.0" y="210.0" font-family="Arial" font-size="3.7" font-weight="bold" fill="#000000" text-anchor="start">Permanent evaluation panel and paired regional analysis</text></g>
<g id="evaluation-only-1"><text x="13.0" y="216.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">24 new regions × 3 images = 72; evaluation only</text></g>
<g id="evaluation-only-2"><text x="13.0" y="221.5" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">No panel feedback to selection, calibration or checkpoint choice</text></g>
<g id="analysis-order-1"><text x="13.0" y="227.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">1  Within each fit and region, sum the 3 image confusion matrices</text></g>
<g id="analysis-order-2"><text x="13.0" y="232.5" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">2  Compute regional union-class mIoU</text></g>
<g id="analysis-order-3"><text x="13.0" y="238.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">3  Average 3 allocations × 3 paired fit seeds (= 9 fits) within each region</text></g>
<g id="analysis-order-4"><text x="13.0" y="243.5" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">4  Form 24 paired region differences; bootstrap regions 10,000 times</text></g>
</g>
<g id="arrows" inkscape:groupmode="layer" inkscape:label="Forward flow only">
<g id="development-to-selection"><line x1="90.0" y1="44.0" x2="90.0" y2="56.0" stroke="#000000" stroke-width="0.3" marker-end="url(#arrow)"/></g>
<g id="selection-to-recipes"><line x1="90.0" y1="121.0" x2="90.0" y2="133.0" stroke="#000000" stroke-width="0.3" marker-end="url(#arrow)"/></g>
<g id="recipes-to-evaluation"><line x1="90.0" y1="188.0" x2="90.0" y2="200.0" stroke="#000000" stroke-width="0.3" marker-end="url(#arrow)"/></g>
</g>
<g id="scope-notes" inkscape:groupmode="layer" inkscape:label="Interpretation boundary">
<g id="recipe-nonclaim-1"><text x="8.0" y="263.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Different model recipes do not isolate encoder fine-tuning.</text></g>
<g id="recipe-nonclaim-2"><text x="8.0" y="268.0" font-family="Arial" font-size="3.3" font-weight="normal" fill="#000000" text-anchor="start">Weighted FL is not claimed as novel; quota-versus-FL does not isolate quota rigidity.</text></g>
</g>
</svg>